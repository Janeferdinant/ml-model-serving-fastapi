name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: ruff (lint and format check)
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest with coverage (threshold 90 percent, set in pyproject.toml)
        run: pytest --cov-report=term --cov-report=xml
      - name: Workflow files are valid
        run: check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/ci.yml .github/workflows/release.yml

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Audit the pinned runtime requirements
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  docker:
    name: hadolint, image build and container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Build the image (local only, never pushed)
        run: docker build --tag mlserving:ci .
      - name: Smoke test the running container
        run: sh scripts/docker_smoke.sh mlserving:ci
      - name: Report the image size
        run: |
          size="$(docker image inspect mlserving:ci --format '{{.Size}}')"
          echo "mlserving:ci image size: ${size} bytes" | tee -a "$GITHUB_STEP_SUMMARY"

  compose:
    name: docker compose up and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start the service with docker compose (local build, nothing is pushed)
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Smoke test
        run: python3 scripts/smoke_test.py --base-url http://127.0.0.1:8000 --wait 30
      - name: Stop
        if: always()
        run: docker compose down --volumes
